server:
  port: 8080

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/takeout}
    username: ${SPRING_DATASOURCE_USERNAME:takeout}
    password: ${SPRING_DATASOURCE_PASSWORD:takeout}
  flyway:
    enabled: true
    default-schema: inventory
    schemas: inventory
    create-schemas: true
    table: flyway_schema_history

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
