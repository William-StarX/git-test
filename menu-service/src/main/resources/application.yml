server:
  port: 8080

spring:
  application:
    name: menu-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/takeout}
    username: ${SPRING_DATASOURCE_USERNAME:takeout}
    password: ${SPRING_DATASOURCE_PASSWORD:takeout}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 300ms
      connect-timeout: 300ms
  flyway:
    enabled: true
    default-schema: catalog
    schemas: catalog

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
