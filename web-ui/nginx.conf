server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/menu {
        set $upstream_menu menu-service:8080;
        proxy_pass http://$upstream_menu;
        proxy_set_header Host $host;
        proxy_set_header X-Cache $upstream_cache_status;
    }

    location ~ ^/api/menu/[^/]+/stock$ {
        set $upstream_inventory inventory-service:8080;
        proxy_pass http://$upstream_inventory;
        proxy_set_header Host $host;
        proxy_set_header X-Cache $upstream_cache_status;
    }

    location = /api/orders {
        set $upstream_order order-service:8080;
        proxy_pass http://$upstream_order;
        proxy_set_header Host $host;
        proxy_set_header X-Cache $upstream_cache_status;
    }

    location ~ ^/api/orders/ {
        set $upstream_order order-service:8080;
        proxy_pass http://$upstream_order;
        proxy_set_header Host $host;
        proxy_set_header X-Cache $upstream_cache_status;
    }

    location = /actuator/health {
        set $upstream_order order-service:8080;
        proxy_pass http://$upstream_order;
        proxy_set_header Host $host;
        proxy_set_header X-Cache $upstream_cache_status;
    }

    location /internal {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
