<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巷口食堂 · 本地点餐</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <p class="hero-eyebrow">巷口食堂</p>
      <h1>热腾腾的家常味</h1>
      <p class="hero-sub">现点现做，堂食外带皆宜。</p>
      <a class="hero-cta" href="#menu">开始点餐</a>
    </div>
    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="一碗面">
        <ellipse cx="100" cy="120" rx="80" ry="30" fill="#e8d9c5"/>
        <path d="M30 110 Q100 60 170 110 Q170 160 100 160 Q30 160 30 110 Z" fill="#f4ede2" stroke="#c9b79c" stroke-width="3"/>
        <path d="M55 108 Q100 88 145 108" fill="none" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/>
        <circle cx="85" cy="112" r="8" fill="#b5533c"/>
        <circle cx="115" cy="116" r="7" fill="#7a9a4e"/>
        <path d="M70 70 L130 40" stroke="#8a6a4a" stroke-width="4" stroke-linecap="round"/>
        <path d="M80 66 L140 36" stroke="#8a6a4a" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</header>

<main>
  <section class="menu-section" id="menu">
    <div class="section-head">
      <h2>今日菜单</h2>
      <p class="section-sub">库存实时更新</p>
    </div>
    <p id="menu-status" role="status" aria-live="polite">正在加载菜单…</p>
    <div id="menu-list" class="menu-grid"></div>
  </section>

  <section class="cart-section">
    <div class="section-head"><h2>购物车</h2></div>
    <div class="cart-panel" data-testid="cart">
      <div id="cart" class="cart-list"></div>
      <div class="cart-summary" id="cart-summary">合计：¥0.00</div>
      <div class="cart-actions">
        <button id="place-order" class="btn" type="button" data-testid="place-order" disabled>提交订单</button>
      </div>
      <p id="order-feedback" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section class="order-section">
    <div class="section-head"><h2>查询订单</h2></div>
    <form id="lookup-form" class="lookup-form" data-testid="lookup-order">
      <label for="order-id-input">订单号</label>
      <input id="order-id-input" name="orderId" type="text" autocomplete="off" placeholder="输入订单号" data-testid="order-id">
      <button class="btn" type="submit">查询</button>
    </form>
    <div id="order-panel" class="order-panel" hidden>
      <p>订单号：<span id="order-id-display"></span></p>
      <p>状态：<span id="order-status" data-testid="order-status"></span></p>
      <ul id="order-items"></ul>
      <p>合计：<span id="order-total"></span></p>
      <button id="cancel-order" class="btn" type="button" data-testid="cancel-order" hidden>取消订单</button>
    </div>
  </section>
</main>

<footer class="site-footer">本地点餐演示</footer>
<script src="/app.js"></script>
</body>
</html>
