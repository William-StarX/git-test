spring:
  application:
    name: takeout-orders
  datasource:
    url: ${TAKEOUT_DB_URL:jdbc:postgresql://127.0.0.1:5432/takeout}
    username: takeout
    password: ${TAKEOUT_DB_PASSWORD:takeout-local-db}
  flyway:
    connect-retries: 10
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: localhost
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: localhost
    username: takeout
    password: ${TAKEOUT_MQ_PASSWORD:takeout-local-mq}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 2
        prefetch: 16

management:
  endpoints:
    web:
      exposure:
        include: health
