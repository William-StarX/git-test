server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/takeout}
    username: ${SPRING_DATASOURCE_USERNAME:takeout}
    password: ${SPRING_DATASOURCE_PASSWORD:takeout}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 2
        prefetch: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

order:
  compensator:
    interval-ms: ${ORDER_COMPENSATOR_INTERVAL_MS:60000}
  release-retry:
    interval-ms: ${ORDER_RELEASE_RETRY_INTERVAL_MS:30000}

MENU_BASE_URL: ${MENU_BASE_URL:http://localhost:8081}
INVENTORY_BASE_URL: ${INVENTORY_BASE_URL:http://localhost:8082}
